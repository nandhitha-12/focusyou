<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusYou · Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffdde1 0%, #d4e9ff 50%, #f8e8ff 100%);
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
            position: relative;
        }

        /* Background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-blob-1 {
            width: 600px;
            height: 600px;
            background: #ff80ab;
            opacity: 0.12;
            top: -200px;
            right: -150px;
            filter: blur(80px);
        }
        .bg-blob-2 {
            width: 550px;
            height: 550px;
            background: #4fc3f7;
            opacity: 0.12;
            bottom: -150px;
            left: -150px;
            filter: blur(80px);
        }

        /* Split Container */
        .login-container {
            position: relative;
            z-index: 10;
            max-width: 920px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 8px 50px rgba(233, 30, 99, 0.08), 0 4px 20px rgba(33, 150, 243, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Left Side - Image Section */
        .login-image-section {
            background: linear-gradient(145deg, #ff80ab, #e91e63, #4fc3f7, #2196f3);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-image-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 8s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        .login-image-section .image-wrapper {
            position: relative;
            z-index: 1;
        }

        .login-image-section img {
            max-width: 240px;
            height: auto;
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.15));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .login-image-section .brand-text {
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
        }

        .login-image-section .brand-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .login-image-section .brand-text p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            margin-top: 0.5rem;
            font-weight: 400;
        }

        /* Decorative shapes on image side */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            z-index: 0;
        }
        .shape-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -50px;
        }
        .shape-2 {
            width: 150px;
            height: 150px;
            bottom: -30px;
            right: -30px;
        }
        .shape-3 {
            width: 100px;
            height: 100px;
            top: 30%;
            right: -20px;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Right Side - Form Section */
        .login-form-section {
            padding: 2.8rem 2.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header */
        .app-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            margin-bottom: 0.1rem;
        }
        .app-title span {
            background: linear-gradient(135deg, #ff4081, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.2rem;
        }

        .welcome-text {
            font-size: 0.95rem;
            color: #666;
            font-weight: 400;
            margin-bottom: 1.8rem;
        }

        /* Google Button */
        .btn-google {
            width: 100%;
            padding: 0.8rem;
            background: #ffffff;
            border: 1.5px solid #e8e0e0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a1a1a;
            text-decoration: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            margin-bottom: 1.2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .btn-google i {
            font-size: 1.2rem;
            color: #dd4b3e;
        }
        .btn-google:hover {
            background: linear-gradient(135deg, #fff0f3, #f0f8ff);
            border-color: #ff4081;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.12);
        }

        /* OR divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            color: #999;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .divider::before {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, #ff80ab);
        }
        .divider::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(to left, transparent, #4fc3f7);
        }

        /* Form labels */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.3rem;
            display: block;
        }
        .form-label i {
            background: linear-gradient(135deg, #ff4081, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 0.3rem;
            font-size: 0.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: #ffffff;
            border: 1.5px solid #e8e0e0;
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            transition: all 0.3s;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .form-group input::placeholder {
            color: #aaa;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .form-group input:focus {
            border-color: #ff4081;
            box-shadow: 0 0 0 4px rgba(255, 64, 129, 0.08), 0 0 0 8px rgba(79, 195, 247, 0.06);
        }

        /* Remember Me & Forgot */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.2rem 0 1.8rem;
            font-size: 0.85rem;
        }
        .form-row .remember {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1a1a1a;
            font-weight: 500;
            cursor: pointer;
        }
        .form-row .remember input[type="checkbox"] {
            accent-color: #ff4081;
            width: 17px;
            height: 17px;
            cursor: pointer;
            border-radius: 5px;
        }
        .form-row .forgot {
            color: #666;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            position: relative;
        }
        .form-row .forgot::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff4081, #4fc3f7);
            transition: width 0.3s;
        }
        .form-row .forgot:hover::after {
            width: 100%;
        }
        .form-row .forgot:hover {
            color: #1a1a1a;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ff4081, #e91e63, #ec407a);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.3px;
            margin-bottom: 1.2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.25);
        }
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(79, 195, 247, 0.2), transparent);
            transition: left 0.6s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #e91e63, #d81b60, #c2185b);
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(233, 30, 99, 0.35);
        }
        .btn-login:hover::before {
            left: 100%;
        }

        /* Sign up */
        .signup-text {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        .signup-text a {
            color: #1a1a1a;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid #e8e0e0;
            padding-bottom: 0.1rem;
            transition: 0.3s;
            position: relative;
        }
        .signup-text a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff4081, #4fc3f7);
            transition: width 0.3s;
        }
        .signup-text a:hover::after {
            width: 100%;
        }
        .signup-text a:hover {
            border-bottom-color: transparent;
        }

        /* designed by freepik */
        .footer-credit {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #ccc;
            letter-spacing: 0.2px;
        }
        .footer-credit i {
            font-size: 0.6rem;
            margin: 0 0.2rem;
            background: linear-gradient(135deg, #ff4081, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .footer-credit strong {
            font-weight: 600;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 440px;
            }
            .login-image-section {
                padding: 2rem 1.5rem;
                border-radius: 32px 32px 0 0;
            }
            .login-image-section img {
                max-width: 140px;
            }
            .login-image-section .brand-text h1 {
                font-size: 1.6rem;
            }
            .login-form-section {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 460px) {
            .login-image-section {
                padding: 1.5rem 1rem;
            }
            .login-image-section img {
                max-width: 100px;
            }
            .login-image-section .brand-text h1 {
                font-size: 1.3rem;
            }
            .login-form-section {
                padding: 1.5rem 1.2rem;
            }
            .app-title {
                font-size: 1.3rem;
            }
            .login-subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background blobs -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <!-- Split Login Container -->
    <div class="login-container">

        <!-- LEFT SIDE - Image Section -->
        <div class="login-image-section">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            
            <div class="image-wrapper">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Login illustration">
            </div>
            
            <div class="brand-text">
                <h1>FocusYou</h1>
                <p>Turn small focus into big wins 💫</p>
            </div>
        </div>

        <!-- RIGHT SIDE - Form Section -->
        <div class="login-form-section">

            <!-- Header -->
            <div class="app-title">Focus<span>You</span></div>
            <div class="login-subtitle">Login now</div>
            <div class="welcome-text">Hi, Welcome back 👋</div>

            <!-- Login with Google -->
            <a href="/login/google" class="btn-google">
                <i class="fab fa-google"></i> Login with Google
            </a>

            <!-- OR Divider -->
            <div class="divider">or Login with Email</div>

            <!-- Login Form -->
            <form method="POST" action="/login">
                
                <!-- Email -->
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Enter your email id" required>
                </div>

                <!-- Password -->
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>

                <!-- Remember Me & Forgot -->
                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" name="remember" checked>
                        <span>Remember Me</span>
                    </label>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-login">Login</button>
            </form>

            <!-- Sign up -->
            <div class="signup-text">
                Not registered yet? Create an account <a href="/register">SignUp</a>
            </div>

            <!-- Designed by freepik -->
            <div class="footer-credit">
                <i class="fas fa-pen-fancy"></i> designed by <strong>freepik</strong>
            </div>
        </div>

    </div>

</body>
</html>
