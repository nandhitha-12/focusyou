<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusYou · Sign Up</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffdde1 0%, #d4e9ff 50%, #f8e8ff 100%);
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
            position: relative;
        }

        /* Background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-blob-1 {
            width: 600px;
            height: 600px;
            background: #ff80ab;
            opacity: 0.12;
            top: -200px;
            right: -150px;
            filter: blur(80px);
        }
        .bg-blob-2 {
            width: 550px;
            height: 550px;
            background: #4fc3f7;
            opacity: 0.12;
            bottom: -150px;
            left: -150px;
            filter: blur(80px);
        }

        /* Main Card */
        .register-card {
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 2.8rem 2.2rem 2.5rem;
            box-shadow: 0 8px 50px rgba(233, 30, 99, 0.08), 0 4px 20px rgba(33, 150, 243, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Header */
        .register-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 1.8rem;
            text-align: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: #ffffff;
            border: 1.5px solid #e8e0e0;
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            transition: all 0.3s;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .form-group input::placeholder {
            color: #aaa;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .form-group input:focus {
            border-color: #ff4081;
            box-shadow: 0 0 0 4px rgba(255, 64, 129, 0.08), 0 0 0 8px rgba(79, 195, 247, 0.06);
        }

        /* Register Button */
        .btn-register {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #ff4081, #e91e63, #ec407a);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
            margin-bottom: 1.2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.25);
        }
        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(79, 195, 247, 0.2), transparent);
            transition: left 0.6s;
        }
        .btn-register:hover {
            background: linear-gradient(135deg, #e91e63, #d81b60, #c2185b);
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(233, 30, 99, 0.35);
        }
        .btn-register:hover::before {
            left: 100%;
        }

        /* Login link */
        .login-text {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
        .login-text a {
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #e8e0e0;
            padding-bottom: 0.1rem;
            transition: 0.3s;
            position: relative;
        }
        .login-text a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff4081, #4fc3f7);
            transition: width 0.3s;
        }
        .login-text a:hover::after {
            width: 100%;
        }
        .login-text a:hover {
            border-bottom-color: transparent;
        }

        /* Decorative dots */
        .deco-dots {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }
        .deco-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: transform 0.3s;
        }
        .deco-dots span:hover {
            transform: scale(1.6);
        }
        .deco-dots .pink {
            background: #ff4081;
            box-shadow: 0 2px 8px rgba(255, 64, 129, 0.3);
        }
        .deco-dots .blue {
            background: #4fc3f7;
            box-shadow: 0 2px 8px rgba(79, 195, 247, 0.3);
        }
        .deco-dots .pink-light {
            background: #ff80ab;
        }
        .deco-dots .blue-light {
            background: #81d4fa;
        }

        @media (max-width: 460px) {
            .register-card {
                padding: 2rem 1.5rem;
            }
            .register-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background blobs -->
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>

    <div class="register-card">

        <!-- Header -->
        <div class="register-title">Create Account</div>

        <!-- Register Form -->
        <form method="POST" action="/register">
            
            <!-- Email -->
            <div class="form-group">
                <input type="email" name="email" placeholder="Enter email" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <!-- Username -->
            <div class="form-group">
                <input type="text" name="username" placeholder="Enter username" required>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn-register">Register</button>
        </form>

        <!-- Login link -->
        <div class="login-text">
            Already have an account? <a href="/">Login</a>
        </div>

        <!-- Decorative dots -->
        <div class="deco-dots">
            <span class="pink"></span>
            <span class="blue"></span>
            <span class="pink-light"></span>
            <span class="blue-light"></span>
            <span class="pink"></span>
        </div>

    </div>

</body>
</html>
